<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <marker id="arrowGy" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8b949e"/></marker>
  </defs>
  <rect width="760" height="440" fill="url(#bg)" rx="10"/>

  <!-- Title -->
  <text x="380" y="34" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="700">Ghosting: Bekas Elemen Statis yang Permanen</text>
  <text x="380" y="56" text-anchor="middle" fill="#8b949e" font-size="13">Status bar &amp; ikon yang nyala terus-menerus meninggalkan jejak di layar OLED</text>

  <!-- Phone body -->
  <rect x="300" y="72" width="160" height="330" rx="22" fill="#21262d" stroke="#30363d" stroke-width="2"/>
  <!-- Screen -->
  <rect x="308" y="80" width="144" height="314" rx="14" fill="#0a0d11"/>
  <!-- Greenish tint hint (blue degraded) -->
  <rect x="308" y="80" width="144" height="314" rx="14" fill="#3fd66f" opacity="0.05"/>

  <!-- Notch ghost -->
  <rect x="356" y="88" width="48" height="12" rx="6" fill="#9fb4a3" opacity="0.25"/>

  <!-- Status bar ghost -->
  <rect x="318" y="112" width="34" height="9" rx="2" fill="#9fb4a3" opacity="0.3"/>
  <rect x="414" y="112" width="26" height="9" rx="2" fill="#9fb4a3" opacity="0.3"/>

  <!-- Dock ghost: 4 app icons -->
  <rect x="318" y="322" width="28" height="28" rx="8" fill="#9fb4a3" opacity="0.32"/>
  <rect x="352" y="322" width="28" height="28" rx="8" fill="#9fb4a3" opacity="0.32"/>
  <rect x="386" y="322" width="28" height="28" rx="8" fill="#9fb4a3" opacity="0.32"/>
  <rect x="420" y="322" width="28" height="28" rx="8" fill="#9fb4a3" opacity="0.32"/>

  <!-- Home indicator ghost -->
  <rect x="350" y="376" width="60" height="5" rx="2.5" fill="#9fb4a3" opacity="0.25"/>

  <!-- Left annotation -->
  <text x="284" y="112" text-anchor="end" fill="#e6edf3" font-size="13" font-weight="700">Status bar &amp; ikon</text>
  <text x="284" y="130" text-anchor="end" fill="#8b949e" font-size="12">yang nyala statis</text>
  <text x="284" y="146" text-anchor="end" fill="#8b949e" font-size="12">memakan pixel lebih cepat</text>
  <line x1="288" y1="124" x2="314" y2="116" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrowGy)"/>

  <!-- Right annotation -->
  <text x="478" y="322" text-anchor="start" fill="#e6edf3" font-size="13" font-weight="700">Ghost permanen</text>
  <text x="478" y="340" text-anchor="start" fill="#8b949e" font-size="12">Sisa emisi nempel di pixel,</text>
  <text x="478" y="356" text-anchor="start" fill="#8b949e" font-size="12">biru lemah bikin tampak kehijauan</text>
  <line x1="474" y1="334" x2="452" y2="336" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrowGy)"/>

  <!-- Disclaimer -->
  <text x="380" y="424" text-anchor="middle" fill="#6e7681" font-size="10">Ilustrasi, bukan foto perangkat spesifik.</text>
</svg>
