<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <marker id="arrowB" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4d9fff"/></marker>
    <marker id="arrowG" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3fd66f"/></marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ff6b5e"/></marker>
  </defs>

  <rect width="760" height="440" fill="url(#bg)" rx="10"/>

  <!-- Title -->
  <text x="380" y="34" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="700">Jarak Energi Emisi (Bandgap) per Warna</text>
  <text x="380" y="56" text-anchor="middle" fill="#8b949e" font-size="13">Semakin lebar jarak HOMO–LUMO, semakin besar energi foton &amp; semakin keras "tugas" emisinya</text>

  <!-- Axis -->
  <line x1="70" y1="70" x2="70" y2="300" stroke="#30363d" stroke-width="1.5"/>
  <text x="26" y="185" fill="#8b949e" font-size="12" transform="rotate(-90 26 185)" text-anchor="middle">Energi (eV)</text>

  <!-- ===== BLUE ===== -->
  <g>
    <!-- gap background -->
    <rect x="105" y="112" width="120" height="158" fill="#4d9fff" opacity="0.08"/>
    <!-- HOMO / LUMO lines -->
    <line x1="105" y1="112" x2="225" y2="112" stroke="#e6edf3" stroke-width="3"/>
    <line x1="105" y1="270" x2="225" y2="270" stroke="#e6edf3" stroke-width="3"/>
    <text x="105" y="104" fill="#8b949e" font-size="12" text-anchor="start">LUMO</text>
    <text x="105" y="288" fill="#8b949e" font-size="12" text-anchor="start">HOMO</text>
    <!-- transition arrow -->
    <line x1="165" y1="262" x2="165" y2="122" stroke="#4d9fff" stroke-width="2.5" marker-end="url(#arrowB)"/>
    <text x="178" y="195" fill="#4d9fff" font-size="15" font-weight="700" text-anchor="start">~2.6–2.7 eV</text>
    <!-- color swatch + label -->
    <rect x="135" y="305" width="60" height="14" rx="3" fill="#4d9fff"/>
    <text x="165" y="340" fill="#e6edf3" font-size="15" font-weight="700" text-anchor="middle">BIRU</text>
    <text x="165" y="358" fill="#8b949e" font-size="11" text-anchor="middle">450 nm</text>
    <!-- penalty tag -->
    <rect x="105" y="372" width="120" height="22" rx="4" fill="#ff6b5e" opacity="0.15"/>
    <text x="165" y="387" fill="#ff9d94" font-size="11" font-weight="700" text-anchor="middle">TERBEKAS</text>
  </g>

  <!-- ===== GREEN ===== -->
  <g>
    <rect x="300" y="150" width="120" height="120" fill="#3fd66f" opacity="0.08"/>
    <line x1="300" y1="150" x2="420" y2="150" stroke="#e6edf3" stroke-width="3"/>
    <line x1="300" y1="270" x2="420" y2="270" stroke="#e6edf3" stroke-width="3"/>
    <text x="300" y="142" fill="#8b949e" font-size="12" text-anchor="start">LUMO</text>
    <text x="300" y="288" fill="#8b949e" font-size="12" text-anchor="start">HOMO</text>
    <line x1="360" y1="262" x2="360" y2="160" stroke="#3fd66f" stroke-width="2.5" marker-end="url(#arrowG)"/>
    <text x="373" y="215" fill="#3fd66f" font-size="15" font-weight="700" text-anchor="start">~2.2 eV</text>
    <rect x="330" y="305" width="60" height="14" rx="3" fill="#3fd66f"/>
    <text x="360" y="340" fill="#e6edf3" font-size="15" font-weight="700" text-anchor="middle">HIJAU</text>
    <text x="360" y="358" fill="#8b949e" font-size="11" text-anchor="middle">520 nm</text>
    <rect x="300" y="372" width="120" height="22" rx="4" fill="#3fd66f" opacity="0.15"/>
    <text x="360" y="387" fill="#7fe8a3" font-size="11" font-weight="700" text-anchor="middle">MODERAT</text>
  </g>

  <!-- ===== RED ===== -->
  <g>
    <rect x="495" y="185" width="120" height="85" fill="#ff6b5e" opacity="0.08"/>
    <line x1="495" y1="185" x2="615" y2="185" stroke="#e6edf3" stroke-width="3"/>
    <line x1="495" y1="270" x2="615" y2="270" stroke="#e6edf3" stroke-width="3"/>
    <text x="495" y="177" fill="#8b949e" font-size="12" text-anchor="start">LUMO</text>
    <text x="495" y="288" fill="#8b949e" font-size="12" text-anchor="start">HOMO</text>
    <line x1="555" y1="262" x2="555" y2="195" stroke="#ff6b5e" stroke-width="2.5" marker-end="url(#arrowR)"/>
    <text x="568" y="232" fill="#ff6b5e" font-size="15" font-weight="700" text-anchor="start">~1.9 eV</text>
    <rect x="525" y="305" width="60" height="14" rx="3" fill="#ff6b5e"/>
    <text x="555" y="340" fill="#e6edf3" font-size="15" font-weight="700" text-anchor="middle">MERAH</text>
    <text x="555" y="358" fill="#8b949e" font-size="11" text-anchor="middle">620 nm</text>
    <rect x="495" y="372" width="120" height="22" rx="4" fill="#ff6b5e" opacity="0.15"/>
    <text x="555" y="387" fill="#ff9d94" font-size="11" font-weight="700" text-anchor="middle">PALING AMAN</text>
  </g>

  <!-- Double penalty callout -->
  <g>
    <rect x="648" y="120" width="100" height="150" rx="8" fill="#ff6b5e" opacity="0.10" stroke="#ff6b5e" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="698" y="148" fill="#ff9d94" font-size="13" font-weight="700" text-anchor="middle">DUA HUKUMAN</text>
    <text x="698" y="172" fill="#e6edf3" font-size="11" text-anchor="middle">1. Energi tinggi</text>
    <text x="698" y="188" fill="#e6edf3" font-size="11" text-anchor="middle">2. Material</text>
    <text x="698" y="204" fill="#e6edf3" font-size="11" text-anchor="middle">kurang stabil</text>
    <text x="698" y="228" fill="#8b949e" font-size="10" text-anchor="middle">berlapis →</text>
    <text x="698" y="244" fill="#ff9d94" font-size="11" font-weight="700" text-anchor="middle">biru mati duluan</text>
  </g>
</svg>
