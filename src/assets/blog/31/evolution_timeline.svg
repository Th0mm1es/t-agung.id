<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .title { font-size: 22px; font-weight: 700; fill: #e2e8f0; }
      .year { font-size: 13px; font-weight: 600; fill: #fbbf24; }
      .event { font-size: 12px; fill: #cbd5e1; }
      .small { font-size: 10px; fill: #64748b; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>
  
  <rect width="900" height="500" rx="16" fill="url(#bg)" stroke="#334155" stroke-width="2"/>
  
  <text x="450" y="35" text-anchor="middle" class="title">Evolusi LIDAR &amp; RADAR</text>
  
  <!-- LIDAR Timeline (top half) -->
  <text x="50" y="72" class="title" fill="#f87171" font-size="16">LIDAR Timeline</text>
  <line x1="50" y1="90" x2="850" y2="90" stroke="#f87171" stroke-width="2" stroke-opacity="0.3"/>
  
  <circle cx="80" cy="90" r="6" fill="#f87171"/>
  <text x="80" y="110" text-anchor="middle" class="year">1960</text>
  <text x="80" y="125" text-anchor="middle" class="event">Era Laser</text>
  
  <circle cx="200" cy="90" r="6" fill="#f87171"/>
  <text x="200" y="110" text-anchor="middle" class="year">1980-an</text>
  <text x="200" y="125" text-anchor="middle" class="event">Riset Militèr</text>
  
  <circle cx="320" cy="90" r="6" fill="#f87171"/>
  <text x="320" y="110" text-anchor="middle" class="year">2004</text>
  <text x="320" y="125" text-anchor="middle" class="event">Stanley (Darpa)</text>
  
  <circle cx="450" cy="90" r="6" fill="#f87171"/>
  <text x="450" y="110" text-anchor="middle" class="year">2009</text>
  <text x="450" y="125" text-anchor="middle" class="event">Google/Waymo</text>
  
  <circle cx="580" cy="90" r="6" fill="#f87171"/>
  <text x="580" y="110" text-anchor="middle" class="year">2016</text>
  <text x="580" y="125" text-anchor="middle" class="event">1550nm</text>
  <text x="580" y="140" text-anchor="middle" class="small">Komersial</text>
  
  <circle cx="700" cy="90" r="6" fill="#f87171"/>
  <text x="700" y="110" text-anchor="middle" class="year">2023</text>
  <text x="700" y="125" text-anchor="middle" class="event">Solid-State</text>
  <text x="700" y="140" text-anchor="middle" class="small">Massa Pasar</text>
  
  <circle cx="810" cy="90" r="6" fill="#f87171"/>
  <text x="810" y="110" text-anchor="middle" class="year">2025</text>
  <text x="810" y="125" text-anchor="middle" class="event">&lt;$1000</text>
  <text x="810" y="140" text-anchor="middle" class="small">Target OEM</text>
  
  <!-- RADAR Timeline (bottom half) -->
  <text x="50" y="230" class="title" fill="#60a5fa" font-size="16">RADAR Timeline</text>
  <line x1="50" y1="250" x2="850" y2="250" stroke="#60a5fa" stroke-width="2" stroke-opacity="0.3"/>
  
  <circle cx="80" cy="250" r="6" fill="#60a5fa"/>
  <text x="80" y="270" text-anchor="middle" class="year">1930-an</text>
  <text x="80" y="285" text-anchor="middle" class="event">Perang Dunia II</text>
  
  <circle cx="200" cy="250" r="6" fill="#60a5fa"/>
  <text x="200" y="270" text-anchor="middle" class="year">1997</text>
  <text x="200" y="285" text-anchor="middle" class="event">ACC Pertama</text>
  <text x="200" y="300" text-anchor="middle" class="small">(Lexus LS)</text>
  
  <circle cx="320" cy="250" r="6" fill="#60a5fa"/>
  <text x="320" y="270" text-anchor="middle" class="year">2000-an</text>
  <text x="320" y="285" text-anchor="middle" class="event">ACC Komersial</text>
  
  <circle cx="450" cy="250" r="6" fill="#60a5fa"/>
  <text x="450" y="270" text-anchor="middle" class="year">2016</text>
  <text x="450" y="285" text-anchor="middle" class="event">77GHz (Korea)</text>
  <text x="450" y="300" text-anchor="middle" class="small">Regulasi</text>
  
  <circle cx="580" cy="250" r="6" fill="#60a5fa"/>
  <text x="580" y="270" text-anchor="middle" class="year">2022</text>
  <text x="580" y="285" text-anchor="middle" class="event">77-81 GHz</text>
  <text x="580" y="300" text-anchor="middle" class="small">Global</text>
  
  <circle cx="700" cy="250" r="6" fill="#60a5fa"/>
  <text x="700" y="270" text-anchor="middle" class="year">2024</text>
  <text x="700" y="285" text-anchor="middle" class="event">4D Imaging</text>
  <text x="700" y="300" text-anchor="middle" class="small">RADAR</text>
  
  <circle cx="810" cy="250" r="6" fill="#60a5fa"/>
  <text x="810" y="270" text-anchor="middle" class="year">2026</text>
  <text x="810" y="285" text-anchor="middle" class="event">Photonic</text>
  <text x="810" y="300" text-anchor="middle" class="small">Photonic R&amp;D</text>
  
  <!-- Key stats -->
  <rect x="50" y="350" width="800" height="130" rx="12" fill="rgba(51,65,85,0.5)" stroke="#334155" stroke-width="1"/>
  <text x="100" y="380" class="event" font-weight="600" fill="#94a3b8">Stat Kunci</text>
  <text x="100" y="405" class="event">LIDAR pasar global: $1.6B (2023) → $7.7B (2030) | CAGR ~24%</text>
  <text x="100" y="425" class="event">RADAR pasar global: $9.2B (2023) → $13.6B (2030) | CAGR ~6%</text>
  <text x="100" y="445" class="event">Arsitektur multi-sensor (non-Tesla): 1 LIDAR + 3-5 RADAR + 8-12 Kamera</text>
  <text x="500" y="405" class="event">LIDAR harga turun 80% (2016-2025)</text>
  <text x="500" y="425" class="event">4D RADAR: resolusi &lt;2m elevasi</text>
  <text x="500" y="445" class="event">Photonic RADAR: belum massal, R&amp;D aktif</text>
</svg>