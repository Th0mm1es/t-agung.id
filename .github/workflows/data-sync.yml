name: Periodic Data Sync & Benchmark Refresh

on:
  # Run 3 times a week (Mondays, Wednesdays, Fridays at 12:00 noon Germany time / 10:00 UTC)
  schedule:
    - cron: '0 10 * * 1,3,5'
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  sync-statistics:
    name: Sync Official Statistics & Exchange Rates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Core
        run: pnpm --filter @bandinghidup/core build

      - name: Run Statistics Sync Runner
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DESTATIS_USERNAME: ${{ secrets.DESTATIS_USERNAME }}
          DESTATIS_PASSWORD: ${{ secrets.DESTATIS_PASSWORD }}
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
          BPS_API_KEY: ${{ secrets.BPS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: |
          echo "Starting official statistics sync..."
          node scripts/sync_statistics.js
